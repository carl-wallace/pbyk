# Builds pbyk for Linux, macOS and Windows and puts the binaries in a draft GitHub release, for the
# macOS and Windows binaries to be signed and the release published by publish.yml. A push of a tag
# named v<version> makes the draft; <version> must be the version in pbyk/Cargo.toml.
#
# Everything but the signatures is done here, from the tag, so that what is signed is what CI built:
# each archive carries a build provenance attestation, which is checked before what is in it is
# signed. Signing replaces the macOS and Windows archives in the draft with archives of the signed
# binaries, under the same names; publish.yml then checks the signatures, writes SHA256SUMS and an
# attestation over the final files, and publishes.
#
# Two builds, each in its own archives:
#   pbyk-<version>-<target>       production: the NIPR environment and nothing else
#   pbyk-test-<version>-<target>  test: the development and NIPR O&M environments
# The default features (which include the development environment) are off for both, and a step
# below fails a build that holds a store it must not: either store for production, the SIPR store
# for test, which must hold the development store. Neither carries a SIPR environment, whose store
# is private. The GUI is included in both; `pbyk --interactive` is the command line.
#
# A manual run builds and smoke-tests the same binaries and keeps them as workflow artifacts, without
# making a release, which is how to try a change to this workflow before tagging. A manual run given
# release_tag builds from that existing tag and makes its draft. Run it from the tag (`gh workflow
# run release.yml --ref <tag> -f release_tag=<tag>`), so that the provenance names the tag and its
# commit, not the branch the run was started from; the signing scripts refuse an archive whose
# provenance does not name the tag.
#
# No draft is made from a commit whose CI has not passed; see the ci job. BUILT-SHA256SUMS, attested
# with the archives, lists them as built, before signing replaces the macOS and Windows ones, and
# stays in the published release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag (v<version>) to build and make a draft release of; empty to build without one"
        required: false
        default: ""
      skip_ci_check:
        description: "Make the draft even though CI has not passed on the tag's commit (the release notes say so)"
        type: boolean
        default: false

jobs:
  # CI must have passed on the commit being built. ci.yml runs on every push to main and pre-release and on every pull request to main, so a merged commit has a run, which may
  # still be going when the tag is pushed: this waits for it. A manual run can pass skip_ci_check,
  # e.g. when CI failed for a reason unrelated to the change; the draft's notes then say that CI had
  # not passed. A tag push cannot skip it, and a build without a release only reports the result.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REF: ${{ inputs.release_tag || github.sha }}
      WORKFLOWS: ci.yml
      RELEASING: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '' }}
      SKIP: ${{ inputs.skip_ci_check }}
    outputs:
      skipped: ${{ steps.ci.outputs.skipped }}
      sha: ${{ steps.ci.outputs.sha }}
    steps:
      - name: CI passed on the commit being built
        id: ci
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          failed=""
          for wf in $WORKFLOWS; do
            while :; do
              runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$sha" \
                --jq '[.workflow_runs[] | .conclusion // "pending"] | join(" ")')
              echo "$wf on $sha: ${runs:-no run}"
              case " $runs " in
                *" success "*) break ;;
                *" pending "*) sleep 60 ;;
                *) failed="$failed $wf"; break ;;
              esac
            done
          done
          if [ -z "$failed" ]; then
            exit 0
          elif [ "$RELEASING" != true ]; then
            echo "::warning::CI has not passed on $sha:$failed; a build without a release goes ahead"
          elif [ "$SKIP" = true ]; then
            echo "::warning::CI has not passed on $sha:$failed; building anyway (skip_ci_check)"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::CI has not passed on $sha:$failed"
            exit 1
          fi

  build:
    name: build ${{ matrix.flavor }} (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        flavor: [production, test]
        platform:
          # 22.04 rather than ubuntu-latest so the binary needs only glibc 2.35 and the
          # distribution's pcsc-lite, WebKitGTK 4.1, GTK 3 and libxdo; 22.04 is the oldest Ubuntu
          # that has webkit2gtk-4.1.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            builds: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            extra_features: ""
            archive: tar.gz
          # One universal binary, for Apple silicon and Intel Macs alike: both are built and
          # combined with lipo, under the name cargo-binstall looks for on any Mac.
          - os: macos-latest
            target: universal-apple-darwin
            builds: aarch64-apple-darwin x86_64-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            extra_features: ""
            archive: tar.gz
          # vsc adds enrollment with Windows virtual smart cards. It does not bring in reset_vsc,
          # the quarantined VSC reset code.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            builds: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            extra_features: ",vsc"
            archive: zip
        include:
          - flavor: production
            environments: nipr
            prefix: pbyk
            # Stores the build must not hold, and one it must.
            forbidden: certval_stores_(pbdev|sipr)
            required: ""
          - flavor: test
            environments: dev,om_nipr
            prefix: pbyk-test
            forbidden: certval_stores_sipr
            required: certval_stores_pbdev
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      # legacy_p12 accepts PKCS #12 files encrypted the older way (RC2, 3DES, a SHA-1 PRF), as the
      # P12s some enrollments deliver are.
      FEATURES: ${{ matrix.environments }},gui,legacy_p12${{ matrix.platform.extra_features }}
      ARCHIVE_TARGET: ${{ matrix.platform.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      # The same packages, with the same bounds on apt's waits, as ci.yml's clippy-gui job.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 install -y \
            libpcsclite-dev libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
        env:
          DEBIAN_FRONTEND: noninteractive
      # cargo fetches every git source in Cargo.lock, the SIPR store's included, though neither
      # build compiles it.
      - name: read access to certval_stores_sipr
        env:
          SIPR_READ_TOKEN: ${{ secrets.SIPR_READ_TOKEN }}
        run: |
          : "${SIPR_READ_TOKEN:?the SIPR_READ_TOKEN secret is empty}"
          git config --global url."https://x-access-token:${SIPR_READ_TOKEN}@github.com/RedHoundSoftware/certval_stores_sipr".insteadOf ssh://git@github.com/RedHoundSoftware/certval_stores_sipr
      # A fixed version rather than stable, so that a release can be rebuilt with the compiler that
      # built it; bump it on purpose.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.platform.rust_targets }}
      - name: Read the version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "pbyk") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The tag names the version being built
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        run: |
          tag=${RELEASE_TAG:-$GITHUB_REF_NAME}
          if [ "$tag" != "v${{ steps.version.outputs.version }}" ]; then
            echo "tag $tag does not match pbyk ${{ steps.version.outputs.version }}"
            exit 1
          fi
      # The whole dependency graph is listed, and must list, so that a cargo failure cannot pass
      # for an absent store.
      - name: The build holds the stores it should
        env:
          FORBIDDEN: ${{ matrix.forbidden }}
          REQUIRED: ${{ matrix.required }}
        run: |
          for t in ${{ matrix.platform.builds }}; do
            cargo tree --locked -p pbyk --no-default-features --features "$FEATURES" \
              --target "$t" --prefix none --format '{p}' > "deps-$t.txt"
            grep -q '^pbyk ' "deps-$t.txt"
            if grep -E "^${FORBIDDEN} " "deps-$t.txt"; then
              echo "the $t ${{ matrix.flavor }} build holds the store(s) above"
              exit 1
            fi
            if [ -n "$REQUIRED" ] && ! grep -q "^${REQUIRED} " "deps-$t.txt"; then
              echo "the $t ${{ matrix.flavor }} build does not hold $REQUIRED"
              exit 1
            fi
          done
      - name: Build
        run: |
          for t in ${{ matrix.platform.builds }}; do
            cargo build --release --locked -p pbyk --no-default-features --features "$FEATURES" --target "$t"
          done
      # The binary to package: the one build, or on macOS the two combined.
      - name: Combine
        id: bin
        run: |
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          if [ "$RUNNER_OS" = macOS ]; then
            mkdir -p universal
            lipo -create -output universal/pbyk \
              target/aarch64-apple-darwin/release/pbyk target/x86_64-apple-darwin/release/pbyk
            lipo -archs universal/pbyk
            echo "path=universal/pbyk" >> "$GITHUB_OUTPUT"
          else
            echo "path=target/$ARCHIVE_TARGET/release/pbyk$exe" >> "$GITHUB_OUTPUT"
          fi
      # --version is answered before the GUI starts, so it runs on a runner with no display. On
      # macOS this runs the runner's own slice of the universal binary.
      - name: Smoke test
        run: |
          "${{ steps.bin.outputs.path }}" --version | tee smoke.txt
          grep -q "${{ steps.version.outputs.version }}" smoke.txt
      - name: Package
        id: package
        run: |
          name=${{ matrix.prefix }}-${{ steps.version.outputs.version }}-$ARCHIVE_TARGET
          mkdir "$name"
          cp ${{ steps.bin.outputs.path }} pbyk/README.md LICENSE-APACHE LICENSE-MIT "$name"/
          if [ "${{ matrix.platform.archive }}" = zip ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          echo "file=$name.${{ matrix.platform.archive }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.prefix }}-${{ matrix.platform.target }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  draft:
    needs: [ci, build]
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CI_SKIPPED: ${{ needs.ci.outputs.skipped }}
      CI_SHA: ${{ needs.ci.outputs.sha }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      # A provenance attestation for each archive as built, which is checked before what is in it is
      # signed: `gh attestation verify <file> --repo carl-wallace/pbyk --signer-workflow
      # carl-wallace/pbyk/.github/workflows/release.yml --source-ref refs/tags/<tag>`.
      # BUILT-SHA256SUMS is attested too: it stays in the release, and lists the macOS and Windows
      # archives as they were before signing replaced them.
      - name: Built checksums
        working-directory: dist
        run: sha256sum pbyk-* | tee BUILT-SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/pbyk-*
            dist/BUILT-SHA256SUMS
      - name: Draft release
        run: |
          tag=${RELEASE_TAG:-$GITHUB_REF_NAME}
          version=${tag#v}
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          cat > notes.md <<EOF
          pbyk $version for Linux (x86_64, glibc 2.35 or later), macOS (one universal binary, for Apple silicon and Intel) and Windows (x86_64, with virtual smart card enrollment), in two builds:

          - **pbyk-$version-…**: production, for the NIPR environment only.
          - **pbyk-test-$version-…**: test, for the development and NIPR O&M environments. Not for production use.

          The binary opens the GUI; \`pbyk --interactive\` runs it as a command line tool. On Linux it needs pcsc-lite and the WebKitGTK 4.1, GTK 3 and libxdo runtime packages, and on Windows the WebView2 runtime. SHA256SUMS lists each archive's SHA-256; each archive also carries a build provenance attestation, checked with \`gh attestation verify <archive> --repo carl-wallace/pbyk\`.
          EOF
          if [ "$CI_SKIPPED" = true ]; then
            printf '\n**CI had not passed on commit %s when this release was built.**\n' "$CI_SHA" >> notes.md
          fi
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "pbyk $version" \
            --notes-file notes.md \
            $prerelease
