[package]
name = "pbykcorelib"
version = "0.4.2"
publish = false
edition = "2024"
rust-version = "1.89.0"

[dependencies]
base64ct = { version="1.8.3", features = ["alloc"] }
cms = "0.3.0-pre.2"
const-oid = { version = "0.10.2", features = ["db"] }
der = { version = "0.8.1", features = ["alloc", "derive", "oid", "pem"] }
spki = "0.8.0"
x509-cert = "0.3.0"

certval = { version = "0.2.0-rc.3", features = ["std", "rsa"] }
# CMS building, decryption and verification, with the cryptography routed through the platform
# provider registered below. Not yet on crates.io: the workspace [patch.crates-io] takes it from git.
certval-cms = "0.1.0-rc.1"

rsa = { version = "0.10.0", features = ["pkcs1v15"] }
sha2 = "0.11.0"
signature = { version = "3.0.0", features = ["digest", "alloc"]}

log = "0.4.33"
plist = "1.10.0"
reqwest = {version = "0.13.4", default-features = false, features = ["rustls", "multipart", "blocking"]}
serde_json = "1.0.150"
subtle-encoding = "0.5.1"

# Trust-store providers (formerly the single pb_pki crate). core is always
# needed; the environment providers are optional and pulled in by the matching
# feature below. certval_stores_sipr lives in a private repo.
certval_stores_core  = "0.1.0-rc.1"
certval_stores_nipr  = { version = "1.0.0-rc.1", optional = true }
certval_stores_pbdev = { version = "1.0.0-rc.1", optional = true }
certval_stores_sipr  = { git = "ssh://git@github.com/RedHoundSoftware/certval_stores_sipr.git", branch = "main", optional = true }
rand = "0.10.2"
rand_core = { version = "0.10.1"}

# Platform crypto providers that misc::pki::new_pki_environment registers ahead of certval's software
# implementations, and whose `cms` feature new_cms_environment registers ahead of certval-cms's.
[target.'cfg(target_os = "macos")'.dependencies]
certval-security-framework = { version = "0.1.0-rc.1", features = ["cms"] }

[target.'cfg(target_os = "windows")'.dependencies]
certval-cng = { version = "0.1.0-rc.1", features = ["cms"] }

[target.'cfg(target_os = "linux")'.dependencies]
certval-awslc = { version = "0.1.0-rc.1", features = ["cms"] }

[dev-dependencies]
# Self-signed test certificates for the SignedData and EnvelopedData round trips, and a runtime for
# the asynchronous verification entry point.
x509-cert = { version = "0.3.0", features = ["builder"] }
tokio = { version = "1.52.4", features = ["macros", "rt"] }

[features]
default = ["dev"]
dev = ["certval_stores_pbdev/dev"]
om_nipr = ["certval_stores_nipr/om_nipr"]
om_sipr = ["certval_stores_sipr/om_sipr"]
nipr = ["certval_stores_nipr/nipr"]
sipr = ["certval_stores_sipr/sipr"]
