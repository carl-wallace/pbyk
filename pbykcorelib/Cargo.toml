[package]
name = "pbykcorelib"
version = "0.4.2"
edition = "2024"
rust-version = "1.88.0"

[dependencies]
base64ct = { version="1.8.3", features = ["alloc"] }
cms = { version = "0.3.0-pre.2", features = ["builder"] }
const-oid = { version = "0.10.2", features = ["db"] }
der = { version = "0.8.1", features = ["alloc", "derive", "oid", "pem"] }
spki = "0.8.0"
x509-cert = "0.3.0"

# certval has not yet been released, hence use of private branch
certval = { git = "https://github.com/carl-wallace/rust-pki.git", features = ["std", "rsa"], branch = "main"}

rsa = { version = "0.10.0-rc.18", features = ["sha2"] }
sha2 = "0.11.0"
signature = { version = "3.0.0", features = ["digest", "alloc"]}

log = "0.4.33"
plist = "1.10.0"
reqwest = {version = "0.13.4", default-features = false, features = ["rustls", "multipart", "blocking"]}
serde_json = "1.0.150"
subtle-encoding = "0.5.1"

# Trust-store providers (formerly the single pb_pki crate). core is always
# needed; the environment providers are optional and pulled in by the matching
# feature below. certval_stores_sipr lives in a private repo.
certval_stores_core  = { git = "https://github.com/carl-wallace/certval-stores.git", branch = "main" }
certval_stores_nipr  = { git = "https://github.com/carl-wallace/certval-stores.git", branch = "main", optional = true }
certval_stores_pbdev = { git = "https://github.com/carl-wallace/certval-stores.git", branch = "main", optional = true }
certval_stores_sipr  = { git = "ssh://git@github.com/RedHoundSoftware/certval_stores_sipr.git", branch = "main", optional = true }
rand = "0.10.2"
rand_core = { version = "0.10.1"}

[features]
default = ["dev"]
dev = ["certval_stores_pbdev/dev"]
om_nipr = ["certval_stores_nipr/om_nipr"]
om_sipr = ["certval_stores_sipr/om_sipr"]
nipr = ["certval_stores_nipr/nipr"]
sipr = ["certval_stores_sipr/sipr"]
